name: StealthDefense Audit

on:
  push:
    branches: [ "main", "master" ]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Compile Root (v2.x)
      run: |
        mkdir -p build
        javac -d build $(find . -maxdepth 1 -name "*.java")
    - name: Compile v3.0 (SanderUltimate)
      run: |
        mkdir -p v3.0-ultimate/build
        javac -cp "v3.0-ultimate/lib/*" -d v3.0-ultimate/build $(find v3.0-ultimate -name "*.java")
        echo "Compilation verified."
