name: StealthDefense Audit

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: List Files (Debug)
      run: |
        echo "Current directory: $(pwd)"
        ls -la
        echo "--- Root Java Files (v2.x) ---"
        find . -maxdepth 1 -name "*.java"
        echo "--- v3.0 Java Files ---"
        find v3.0-ultimate -name "*.java" 2>/dev/null || echo "v3.0-ultimate not found"

    - name: Compile Root (v2.x)
      run: |
        echo "Compiling v2.x (root)..."
        javac -d build $(find . -maxdepth 1 -name "*.java")
        echo "v2.x compiled."

    - name: Compile v3.0 (SanderUltimate)
      run: |
        echo "Compiling v3.0-ultimate..."
        mkdir -p v3.0-ultimate/build
        javac -d v3.0-ultimate/build $(find v3.0-ultimate -name "*.java")
        echo "v3.0-ultimate compiled."

    - name: Verify Compilation
      run: |
        echo "Checking compiled classes..."
        find build -name "*.class" | head -n 5
        find v3.0-ultimate/build -name "*.class" | head -n 5
        echo "Compilation verified. StealthDefense (v2.x & v3.0) is ready."
